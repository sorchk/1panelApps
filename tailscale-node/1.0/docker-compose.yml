services:
  tailscale-node:
    image: tailscale/tailscale:v1.82.5
    container_name: tailscale-node
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS}
    volumes:
      - ./tailscale:/var/lib/tailscale
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    restart: always
networks:
  1panel-network:
    external: true