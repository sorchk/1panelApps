          labelZh: 数据库服务
          required: true
          type: apps
          values:
            - label: PostgreSQL
              value: postgresql
        - default: zitadel
          envKey: PANEL_DB_NAME
          labelEn: Database
          labelZh: 数据库名
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: zitadel
          envKey: PANEL_DB_USER
          labelEn: User
          labelZh: 数据库用户
          random: true
          required: true
          rule: paramCommon
          type: text
