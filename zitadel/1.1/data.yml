additionalProperties:
    formFields:
        - child:
            default: ""
            envKey: ZITADEL_DATABASE_POSTGRES_HOST
            required: true
            type: service
          default: postgresql
          envKey: ZITADEL_DATABASE_POSTGRES_TYPE
          labelEn: Database Service
          labelZh: 数据库服务
          required: true
          type: apps
          values:
            - label: PostgreSQL
              value: postgresql
        - default: zitadel
          envKey: ZITADEL_DATABASE_POSTGRES_DATABASE
          labelEn: Database
          labelZh: 数据库名
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: zitadel
          envKey: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
          labelEn: User
          labelZh: 数据库用户
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: zitadel
          envKey: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
          labelEn: Password
          labelZh: 数据库用户密码
          random: true
          required: true
          rule: paramComplexity
          type: password
        - default: postgres
          envKey: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
          labelEn: Admin User
          labelZh: 数据库管理员
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: postgres
          envKey: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
          labelEn: Admin Password
          labelZh: 数据库管理员密码
          random: true
          required: true
          rule: paramComplexity
          type: password
        - default: 8901
          edit: true
          envKey: PANEL_APP_PORT_HTTP
          labelEn: Port
          labelZh: 端口
          required: true
          rule: paramPort
