          envKey: ZITADEL_MASTERKEY
          labelEn: Master key
          labelZh: 主密钥
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: https://auth.sction.com
          edit: true
          envKey: ZITADEL_EXTERNALDOMAIN
          labelEn: External URL
          labelZh: 外部访问地址
          required: true
          rule: paramHttp
          type: text
        - default: 443
          edit: true
          envKey: ZITADEL_EXTERNALPORT
          labelEn: External Port
          labelZh: 外部访问端口
          required: true
          rule: paramPort
          type: number

          
